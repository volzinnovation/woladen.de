name: Build onboarded static catalog

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated countries to build."
        required: false
        default: "BE,NL,CH"
        type: string
      include_osm:
        description: "Extract amenities from downloaded OSM PBFs."
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 2 * * 0"

concurrency:
  group: build-onboarded-static-catalog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-onboarded-static-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-open-static.txt

      - name: Install OSM tooling
        if: ${{ inputs.include_osm == true || github.event_name == 'schedule' }}
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Build onboarded static catalog
        env:
          COUNTRIES: ${{ inputs.countries || 'BE,NL,CH' }}
          INCLUDE_OSM: ${{ inputs.include_osm }}
        run: |
          args=(
            --output-dir data/onboarded_static
            --country "$COUNTRIES"
          )

          if [[ "$INCLUDE_OSM" == "true" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            args+=(--include-osm --download-osm-pbf)
          fi

          python scripts/build_onboarded_static_catalog.py "${args[@]}"

      - name: Upload onboarded static catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-static-catalog-${{ github.run_id }}
          path: data/onboarded_static
          if-no-files-found: error
          retention-days: 14
