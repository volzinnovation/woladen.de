name: Build open static SQLite bundle

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country codes to include."
        required: false
        default: "AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI"
        type: string
      source_run_id:
        description: "Optional prior run ID to reuse the open-static-normalized-source artifact instead of rebuilding source rows."
        required: false
        default: ""
        type: string
      amenity_reuse_run_id:
        description: "Optional prior run ID with open-static-normalized-source-ready; reuses its station_amenities.csv, then optionally overlays selected PBF-enriched countries."
        required: false
        default: ""
        type: string
      release_tag:
        description: "GitHub Release tag for app downloads and aggregate bundle assets."
        required: false
        default: "open-static-ios-regional-latest"
        type: string
      refresh_ch_nl_normalized:
        description: "Fetch CH/NL source feeds for EVSE-level normalized rows."
        required: false
        default: true
        type: boolean
      include_osm_pbf:
        description: "Augment station_amenities in a country matrix: DE from woladen.de GeoJSON, non-DE from country PBF files."
        required: false
        default: false
        type: boolean
      amenity_countries:
        description: "Optional comma-separated country codes to enrich when include_osm_pbf is true. Defaults to the full countries input."
        required: false
        default: ""
        type: string
      download_osm_pbf:
        description: "Download missing non-DE country PBF files before OSM extraction. Only used when include_osm_pbf is true."
        required: false
        default: false
        type: boolean
      fail_on_pbf_missing:
        description: "Fail validation when station_amenities.csv still contains pbf_missing rows."
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Publish or update the GitHub Release asset. Leave false for trial enrichment runs."
        required: false
        default: false
        type: boolean
      pbf_progress_every:
        description: "Print PBF scan progress every N OSM objects. Use 0 to disable."
        required: false
        default: "5000000"
        type: string
      pbf_download_progress_mb:
        description: "Print PBF download progress every N MiB. Use 0 to disable."
        required: false
        default: "256"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: ${{ inputs.source_run_id == '' }}
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-open-static.txt

      - name: Fetch static source payloads
        if: ${{ inputs.source_run_id == '' }}
        env:
          COUNTRIES: ${{ inputs.countries || 'AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI' }}
          WOLADEN_COMMERCIAL_SQLITE_PATH: ${{ runner.temp }}/commercial_state.sqlite3
          WOLADEN_COMMERCIAL_RAW_PAYLOAD_DIR: ${{ runner.temp }}/commercial_raw
          AT_ECONTROL_API_KEY: ${{ secrets.AT_ECONTROL_API_KEY }}
          AT_ECONTROL_REFERER: ${{ secrets.AT_ECONTROL_REFERER || 'https://woladen.de' }}
          AT_LADESTELLEN_USER: ${{ secrets.AT_LADESTELLEN_USER }}
          AT_LADESTELLEN_PASSWORD: ${{ secrets.AT_LADESTELLEN_PASSWORD }}
          PL_EIPA_READER_TOKEN: ${{ secrets.PL_EIPA_READER_TOKEN }}
          NOBIL_API_KEY: ${{ secrets.NO_SE_NOBIL_KEY }}
          NO_SE_NOBIL_KEY: ${{ secrets.NO_SE_NOBIL_KEY }}
          NO_SE_NOBIL_ENOVA_KEY: ${{ secrets.NO_SE_NOBIL_KEY }}
          TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN: ${{ secrets.TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN }}
          TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN_C: ${{ secrets.TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN_C }}
          TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN_C_FILE: ${{ runner.temp }}/energyvision-prod-token-c.txt
          MONTA_PUBLIC_CLIENT_ID: ${{ secrets.MONTA_PUBLIC_CLIENT_ID || secrets.DK_MONTA_CLIENT_ID }}
          MONTA_PUBLIC_CLIENT_SECRET: ${{ secrets.MONTA_PUBLIC_CLIENT_SECRET || secrets.DK_MONTA_CLIENT_SECRET }}
          DK_MONTA_CLIENT_ID: ${{ secrets.DK_MONTA_CLIENT_ID }}
          DK_MONTA_CLIENT_SECRET: ${{ secrets.DK_MONTA_CLIENT_SECRET }}
          SI_NAP_EMAIL: ${{ secrets.SI_NAP_EMAIL || 'raphael.volz@hs-pforzheim.de' }}
          SI_NAP_PASSWORD: ${{ secrets.SI_NAP_PASSWORD }}
          PT_NAP_EMAIL: raphael.volz@hs-pforzheim.de
          PT_NAP_PASSWORD: ${{ secrets.PT_NAP_PASSWORD }}
          HU_NAP_EMAIL: ${{ secrets.HU_NAP_EMAIL || 'raphael.volz@hs-pforzheim.de' }}
          HU_NAP_PASSWORD: ${{ secrets.HU_NAP_PASSWORD }}
          TRANSPORTDATA_LV_ECO_MOVEMENT_STATIC_API_KEY: ${{ secrets.TRANSPORTDATA_LV_ECO_MOVEMENT_STATIC_API_KEY }}
          TRANSPORTDATA_LV_ECO_MOVEMENT_STATUS_PRICE_API_KEY: ${{ secrets.TRANSPORTDATA_LV_ECO_MOVEMENT_STATUS_PRICE_API_KEY }}
          TRANSPORTDATA_LV_LVC_EV_CHARGING_STREAM_API_KEY: ${{ secrets.TRANSPORTDATA_LV_LVC_EV_CHARGING_STREAM_API_KEY }}
        run: |
          set -euo pipefail

          python scripts/commercial_fetch_at_econtrol.py --source all-credentialed --timeout-seconds 180
          selected_countries=",$(printf '%s' "$COUNTRIES" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]'),"
          if [[ "$selected_countries" == *",BE,"* ]]; then
            if [[ -z "$TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN" ]]; then
              echo "Missing TRANSPORTDATA_BE_ENERGYVISION_PROD_TOKEN GitHub Actions secret for BE EnergyVision production OCPI Token A." >&2
              exit 1
            fi
            python scripts/commercial_fetch_be_transportdata.py --source energyvision-tariffs --timeout-seconds 300 --no-parse-summary
            python scripts/commercial_fetch_be_transportdata.py --source energyvision-locations --timeout-seconds 300 --no-parse-summary
            python scripts/commercial_fetch_be_transportdata.py --source road-locations --timeout-seconds 300 --no-parse-summary
            python scripts/commercial_fetch_be_transportdata.py --source indigo-static --timeout-seconds 300 --no-parse-summary
            if [[ -z "$MONTA_PUBLIC_CLIENT_ID" || -z "$MONTA_PUBLIC_CLIENT_SECRET" ]]; then
              echo "Missing MONTA_PUBLIC_CLIENT_ID/MONTA_PUBLIC_CLIENT_SECRET or DK_MONTA_CLIENT_ID/DK_MONTA_CLIENT_SECRET GitHub Actions secrets for BE Monta AFIR static table access." >&2
              exit 1
            fi
            python scripts/commercial_fetch_dk_monta.py --country BE --per-page 1000 --timeout-seconds 600 --no-parse-summary
          fi
          if [[ "$selected_countries" == *",DK,"* ]]; then
            if [[ -z "$MONTA_PUBLIC_CLIENT_ID" || -z "$MONTA_PUBLIC_CLIENT_SECRET" ]]; then
              echo "Missing MONTA_PUBLIC_CLIENT_ID/MONTA_PUBLIC_CLIENT_SECRET or DK_MONTA_CLIENT_ID/DK_MONTA_CLIENT_SECRET GitHub Actions secrets for DK Monta AFIR static table access." >&2
              exit 1
            fi
            python scripts/commercial_fetch_dk_monta.py --country DK --per-page 1000 --timeout-seconds 600 --no-parse-summary
          fi
          python scripts/commercial_fetch_fr_datagouv.py --source base-static --timeout-seconds 300 --no-parse-summary
          python scripts/commercial_fetch_fi_digitraffic.py --source locations-datex --timeout-seconds 300 --no-parse-summary
          python scripts/commercial_fetch_pl_eipa.py --source all-reader-static --timeout-seconds 300 --no-parse-summary
          python scripts/commercial_fetch_eu_public_static.py --source cy,cz,es,gr,lt,lu,mt --timeout-seconds 300 --no-parse-summary
          if [[ "$selected_countries" == *",SI,"* ]]; then
            if [[ -z "$SI_NAP_PASSWORD" ]]; then
              echo "Missing SI_NAP_PASSWORD GitHub Actions secret for SI NAP Prometej B2B DATEX access." >&2
              exit 1
            fi
            python scripts/commercial_fetch_si_nap.py --source table --timeout-seconds 600 --no-parse-summary
          fi
          if [[ "$selected_countries" == *",PT,"* ]]; then
            python scripts/commercial_fetch_pt_mobie.py --source static-datex --timeout-seconds 600 --no-parse-summary
          fi
          if [[ "$selected_countries" == *",HU,"* ]]; then
            if [[ -z "$HU_NAP_PASSWORD" ]]; then
              echo "Missing HU_NAP_PASSWORD GitHub Actions secret for HU NAP subscription discovery." >&2
              exit 1
            fi
            python scripts/commercial_fetch_hu_nap.py --source static-real --timeout-seconds 600 --no-parse-summary
          fi
          if [[ "$selected_countries" == *",LV,"* ]]; then
            if [[ -z "$TRANSPORTDATA_LV_ECO_MOVEMENT_STATIC_API_KEY" ]]; then
              echo "Missing TRANSPORTDATA_LV_ECO_MOVEMENT_STATIC_API_KEY GitHub Actions secret for LV Transportdata Eco-Movement static DATEX." >&2
              exit 1
            fi
            if [[ -z "$TRANSPORTDATA_LV_ECO_MOVEMENT_STATUS_PRICE_API_KEY" ]]; then
              echo "Missing TRANSPORTDATA_LV_ECO_MOVEMENT_STATUS_PRICE_API_KEY GitHub Actions secret for LV Transportdata Eco-Movement status/price DATEX." >&2
              exit 1
            fi
            if [[ -z "$TRANSPORTDATA_LV_LVC_EV_CHARGING_STREAM_API_KEY" ]]; then
              echo "Missing TRANSPORTDATA_LV_LVC_EV_CHARGING_STREAM_API_KEY GitHub Actions secret for LV Transportdata LVC stream snapshot." >&2
              exit 1
            fi
            python scripts/commercial_fetch_lv_transportdata.py --source all --timeout-seconds 600 --no-parse-summary
          fi
          nobil_sources=()
          if [[ "$selected_countries" == *",NO,"* ]]; then
            nobil_sources+=("no-nobil")
          fi
          if [[ "$selected_countries" == *",SE,"* ]]; then
            nobil_sources+=("se-nobil")
          fi
          if (( ${#nobil_sources[@]} )); then
            if [[ -z "${NO_SE_NOBIL_KEY:-}" ]]; then
              echo "Missing NO_SE_NOBIL_KEY GitHub Actions secret for NO/SE NOBIL static datadumps." >&2
              exit 1
            fi
            nobil_source_csv="$(IFS=,; echo "${nobil_sources[*]}")"
            python scripts/commercial_fetch_eu_public_static.py --source "$nobil_source_csv" --timeout-seconds 600 --no-parse-summary
          fi

      - name: Build normalized EU27+NO+CH source bundle
        if: ${{ inputs.source_run_id == '' }}
        env:
          WOLADEN_COMMERCIAL_SQLITE_PATH: ${{ runner.temp }}/commercial_state.sqlite3
          WOLADEN_COMMERCIAL_RAW_PAYLOAD_DIR: ${{ runner.temp }}/commercial_raw
        run: |
          set -euo pipefail

          refresh_flag="--refresh-ch-nl-normalized"
          if [[ "${{ inputs.refresh_ch_nl_normalized }}" != "true" ]]; then
            refresh_flag="--no-refresh-ch-nl-normalized"
          fi

          python scripts/build_eu_static_description_bundle.py \
            --output-dir "$RUNNER_TEMP/eu27_ch_static" \
            --woladen-de-data-dir "$GITHUB_WORKSPACE/data" \
            --onboarded-static-dir "$GITHUB_WORKSPACE/data/onboarded_static" \
            "$refresh_flag"

      - name: Download prior normalized source rows
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: open-static-normalized-source
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eu27_ch_static

      - name: Validate normalized source bundle
        run: |
          normalized_only_flag=""
          if [[ "${{ inputs.source_run_id }}" != "" ]]; then
            normalized_only_flag="--normalized-only"
          fi
          python scripts/validate_open_static_bundle.py \
            --bundle-dir "$RUNNER_TEMP/eu27_ch_static" \
            --require-normalized-rows \
            $normalized_only_flag

      - name: Upload normalized source rows
        uses: actions/upload-artifact@v4
        with:
          name: open-static-normalized-source
          path: |
            ${{ runner.temp }}/eu27_ch_static/stations.csv
            ${{ runner.temp }}/eu27_ch_static/chargers.csv
            ${{ runner.temp }}/eu27_ch_static/station_amenities.csv
            ${{ runner.temp }}/eu27_ch_static/dedupe_report.csv
            ${{ runner.temp }}/eu27_ch_static/source_attribution.json
            ${{ runner.temp }}/eu27_ch_static/summary.json
            ${{ runner.temp }}/eu27_ch_static/catalog_summary.json
            ${{ runner.temp }}/eu27_ch_static/bundle_quality_report.json
          if-no-files-found: error
          retention-days: 3

  plan-countries:
    runs-on: ubuntu-latest
    outputs:
      countries_json: ${{ steps.plan.outputs.countries_json }}
    steps:
      - name: Resolve country matrix
        id: plan
        env:
          COUNTRIES: ${{ inputs.countries || 'AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI' }}
        run: |
          python - <<'PY'
          import json
          import os

          countries = []
          for raw in os.environ["COUNTRIES"].split(","):
            country = raw.strip().upper()
            if country and country not in countries:
              countries.append(country)
          if not countries:
            raise SystemExit("no_countries_selected")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            print(f"countries_json={json.dumps(countries)}", file=handle)
          PY

  plan-amenity-countries:
    runs-on: ubuntu-latest
    outputs:
      countries_json: ${{ steps.plan.outputs.countries_json }}
    steps:
      - name: Resolve amenity country matrix
        id: plan
        env:
          COUNTRIES: ${{ inputs.countries || 'AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI' }}
          AMENITY_COUNTRIES: ${{ inputs.amenity_countries }}
        run: |
          python - <<'PY'
          import json
          import os

          selected = os.environ["AMENITY_COUNTRIES"].strip() or os.environ["COUNTRIES"]
          countries = []
          for raw in selected.split(","):
            country = raw.strip().upper()
            if country and country not in countries:
              countries.append(country)
          if not countries:
            raise SystemExit("no_amenity_countries_selected")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            print(f"countries_json={json.dumps(countries)}", file=handle)
          PY

  enrich-country-amenities:
    if: ${{ inputs.include_osm_pbf }}
    needs:
      - build-source-bundle
      - plan-amenity-countries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        country: ${{ fromJson(needs.plan-amenity-countries.outputs.countries_json) }}
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-open-static.txt

      - name: Download normalized source rows
        uses: actions/download-artifact@v4
        with:
          name: open-static-normalized-source
          path: ${{ runner.temp }}/eu27_ch_static

      - name: Build country amenity part
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          set -euo pipefail

          download_flag=""
          if [[ "$COUNTRY" != "DE" && ( "${{ inputs.download_osm_pbf }}" == "true" || "$COUNTRY" == "SI" || "$COUNTRY" == "HU" || "$COUNTRY" == "LV" || "$COUNTRY" == "DK" ) ]]; then
            download_flag="--download-osm-pbf"
          fi

          python scripts/enrich_open_static_amenities.py country \
            --input-dir "$RUNNER_TEMP/eu27_ch_static" \
            --country "$COUNTRY" \
            --output-dir "$RUNNER_TEMP/amenity-part" \
            --woladen-de-data-dir "$GITHUB_WORKSPACE/data" \
            --pbf-cache-dir "$RUNNER_TEMP/osm_pbf_cache" \
            --pbf-progress-every "${{ inputs.pbf_progress_every }}" \
            --pbf-download-progress-mb "${{ inputs.pbf_download_progress_mb }}" \
            $download_flag

      - name: Upload country amenity part
        uses: actions/upload-artifact@v4
        with:
          name: open-static-amenities-${{ matrix.country }}
          path: |
            ${{ runner.temp }}/amenity-part/station_amenities-${{ matrix.country }}.csv
            ${{ runner.temp }}/amenity-part/amenity-summary-${{ matrix.country }}.json
          if-no-files-found: error
          retention-days: 3

  prepare-normalized-source:
    if: >-
      ${{
        always() &&
        needs.build-source-bundle.result == 'success' &&
        needs.plan-countries.result == 'success' &&
        (inputs.include_osm_pbf != true || needs.enrich-country-amenities.result == 'success')
      }}
    needs:
      - build-source-bundle
      - plan-countries
      - enrich-country-amenities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download normalized source rows
        uses: actions/download-artifact@v4
        with:
          name: open-static-normalized-source
          path: ${{ runner.temp }}/eu27_ch_static

      - name: Download country amenity parts
        if: ${{ inputs.include_osm_pbf }}
        uses: actions/download-artifact@v4
        with:
          pattern: open-static-amenities-*
          path: ${{ runner.temp }}/amenity-parts
          merge-multiple: true

      - name: Download prior prepared amenity rows
        if: ${{ inputs.amenity_reuse_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: open-static-normalized-source-ready
          run-id: ${{ inputs.amenity_reuse_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eu27_ch_static_previous

      - name: Merge country amenity parts
        if: ${{ inputs.include_osm_pbf }}
        run: |
          merge_input_dir="$RUNNER_TEMP/eu27_ch_static"
          if [[ "${{ inputs.amenity_reuse_run_id }}" != "" ]]; then
            python scripts/enrich_open_static_amenities.py reuse \
              --input-dir "$RUNNER_TEMP/eu27_ch_static" \
              --previous-dir "$RUNNER_TEMP/eu27_ch_static_previous" \
              --output-dir "$RUNNER_TEMP/eu27_ch_static_reused"
            merge_input_dir="$RUNNER_TEMP/eu27_ch_static_reused"
          fi
          python scripts/enrich_open_static_amenities.py merge \
            --input-dir "$merge_input_dir" \
            --amenity-parts-dir "$RUNNER_TEMP/amenity-parts" \
            --output-dir "$RUNNER_TEMP/eu27_ch_static_ready"

      - name: Reuse prior amenity rows
        if: ${{ !inputs.include_osm_pbf && inputs.amenity_reuse_run_id != '' }}
        run: |
          python scripts/enrich_open_static_amenities.py reuse \
            --input-dir "$RUNNER_TEMP/eu27_ch_static" \
            --previous-dir "$RUNNER_TEMP/eu27_ch_static_previous" \
            --output-dir "$RUNNER_TEMP/eu27_ch_static_ready"

      - name: Copy source rows without amenity enrichment
        if: ${{ !inputs.include_osm_pbf && inputs.amenity_reuse_run_id == '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/eu27_ch_static_ready"
          cp "$RUNNER_TEMP/eu27_ch_static"/* "$RUNNER_TEMP/eu27_ch_static_ready"/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "eu27_ch_static_ready" / "amenity_merge_summary.json"
          path.write_text(json.dumps({"enabled": False}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate prepared normalized source bundle
        run: |
          pbf_missing_flag=""
          if [[ "${{ inputs.fail_on_pbf_missing }}" == "true" ]]; then
            pbf_missing_flag="--fail-on-pbf-missing"
          fi
          python scripts/validate_open_static_bundle.py \
            --bundle-dir "$RUNNER_TEMP/eu27_ch_static_ready" \
            --normalized-only \
            --require-normalized-rows \
            $pbf_missing_flag

      - name: Upload prepared normalized source rows
        uses: actions/upload-artifact@v4
        with:
          name: open-static-normalized-source-ready
          path: |
            ${{ runner.temp }}/eu27_ch_static_ready/stations.csv
            ${{ runner.temp }}/eu27_ch_static_ready/chargers.csv
            ${{ runner.temp }}/eu27_ch_static_ready/station_amenities.csv
            ${{ runner.temp }}/eu27_ch_static_ready/dedupe_report.csv
            ${{ runner.temp }}/eu27_ch_static_ready/source_attribution.json
            ${{ runner.temp }}/eu27_ch_static_ready/summary.json
            ${{ runner.temp }}/eu27_ch_static_ready/catalog_summary.json
            ${{ runner.temp }}/eu27_ch_static_ready/bundle_quality_report.json
            ${{ runner.temp }}/eu27_ch_static_ready/amenity_merge_summary.json
          if-no-files-found: error
          retention-days: 3

  build-country-part:
    if: >-
      ${{
        always() &&
        needs.prepare-normalized-source.result == 'success' &&
        needs.plan-countries.result == 'success'
      }}
    needs:
      - prepare-normalized-source
      - plan-countries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJson(needs.plan-countries.outputs.countries_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download normalized source rows
        uses: actions/download-artifact@v4
        with:
          name: open-static-normalized-source-ready
          path: ${{ runner.temp }}/eu27_ch_static

      - name: Build country SQLite part
        env:
          SOURCE_BUNDLE_DIR: ${{ runner.temp }}/eu27_ch_static
          COUNTRY: ${{ matrix.country }}
        run: |
          mkdir -p "$RUNNER_TEMP/country-part"
          python scripts/build_open_static_sqlite_bundle.py country \
            --input-dir "$SOURCE_BUNDLE_DIR" \
            --country "$COUNTRY" \
            --output-path "$RUNNER_TEMP/country-part/open-static-$COUNTRY.sqlite3"

      - name: Upload country SQLite part
        uses: actions/upload-artifact@v4
        with:
          name: open-static-country-${{ matrix.country }}
          path: ${{ runner.temp }}/country-part/open-static-${{ matrix.country }}.sqlite3
          if-no-files-found: error
          retention-days: 3

  aggregate-sqlite-bundle:
    if: >-
      ${{
        always() &&
        needs.build-country-part.result == 'success' &&
        needs.prepare-normalized-source.result == 'success'
      }}
    needs:
      - build-country-part
      - prepare-normalized-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG_INPUT"
          if [[ -z "$release_tag" ]]; then
            release_tag="open-static-ios-regional-latest"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download country SQLite parts
        uses: actions/download-artifact@v4
        with:
          pattern: open-static-country-*
          path: ${{ runner.temp }}/country-parts
          merge-multiple: true

      - name: Build GitHub regional iPhone package assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          python scripts/build_open_static_regional_release_assets.py \
            --parts-dir "$RUNNER_TEMP/country-parts" \
            --output-dir "$RUNNER_TEMP/open-static-regional-packs" \
            --github-owner "$owner" \
            --github-repo "$repo" \
            --github-release-tag "$RELEASE_TAG"

      - name: Upload regional iPhone package asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-static-github-regional-packs
          path: |
            ${{ runner.temp }}/open-static-regional-packs/open-static-*.sqlite3.zlib
            ${{ runner.temp }}/open-static-regional-packs/open-static-*.sqlite3.zlib.sha256
            ${{ runner.temp }}/open-static-regional-packs/open-static-*.sqlite3.sha256
            ${{ runner.temp }}/open-static-regional-packs/open-static-*.manifest.json
            ${{ runner.temp }}/open-static-regional-packs/regional_pack_index.json
          if-no-files-found: error
          retention-days: 7

      - name: Download normalized source rows for count check
        uses: actions/download-artifact@v4
        with:
          name: open-static-normalized-source-ready
          path: ${{ runner.temp }}/eu27_ch_static

      - name: Aggregate full SQLite bundle
        run: |
          mkdir -p "$RUNNER_TEMP/open-static"
          python scripts/build_open_static_sqlite_bundle.py aggregate \
            --parts-dir "$RUNNER_TEMP/country-parts" \
            --output-path "$RUNNER_TEMP/open-static/open_static.sqlite3"

      - name: Check SQLite bundle row counts
        run: |
          python scripts/build_open_static_sqlite_bundle.py check-counts \
            --db-path "$RUNNER_TEMP/open-static/open_static.sqlite3" \
            --expected-dir "$RUNNER_TEMP/eu27_ch_static" \
            --countries "${{ inputs.countries || 'AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI' }}"

      - name: Compress and checksum full SQLite bundle
        run: |
          cd "$RUNNER_TEMP/open-static"
          sha256sum open_static.sqlite3 > open_static.sqlite3.sha256
          zstd -19 -T0 -f open_static.sqlite3 -o open_static.sqlite3.zst
          sha256sum open_static.sqlite3.zst > open_static.sqlite3.zst.sha256

      - name: Upload compressed SQLite bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-static-sqlite-bundle
          path: |
            ${{ runner.temp }}/open-static/open_static.sqlite3.zst
            ${{ runner.temp }}/open-static/open_static.sqlite3.zst.sha256
            ${{ runner.temp }}/open-static/open_static.sqlite3.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish SQLite bundle release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG"

          release_notes="$RUNNER_TEMP/open-static/release-notes.md"
          {
            echo "Open static SQLite bundle built by ${GITHUB_WORKFLOW}."
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Countries: ${{ inputs.countries || 'AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI' }}"
            echo "- Source bundle: generated on the GitHub Actions runner"
            echo "- Amenity enrichment: include=${{ inputs.include_osm_pbf }}, countries=${{ inputs.amenity_countries || inputs.countries || 'AT,BE,CH,CY,CZ,DE,DK,ES,FI,FR,GR,HU,LT,LU,LV,MT,NL,NO,PL,PT,SE,SI' }}, download_non_de_pbf=${{ inputs.download_osm_pbf }}, reuse_run=${{ inputs.amenity_reuse_run_id }}"
            echo "- Release assets: open_static.sqlite3.zst, open_static.sqlite3.zst.sha256, open_static.sqlite3.sha256"
            echo "- Regional app assets: open-static-<GROUP>.sqlite3.zlib, open-static-<GROUP>.sqlite3.zlib.sha256, open-static-<GROUP>.sqlite3.sha256, open-static-<GROUP>.manifest.json, regional_pack_index.json"
            echo "- Regional packages: DACH, BENELUX, ROMANIC, NORDICS, REST-EUROPE"
          } > "$release_notes"

          mapfile -t regional_assets < <(
            find "$RUNNER_TEMP/open-static-regional-packs" -maxdepth 1 -type f \( \
              -name 'open-static-*.sqlite3.zlib' -o \
              -name 'open-static-*.sqlite3.zlib.sha256' -o \
              -name 'open-static-*.sqlite3.sha256' -o \
              -name 'open-static-*.manifest.json' -o \
              -name 'regional_pack_index.json' \
            \) | sort
          )

          mapfile -t stale_regional_sqlite_assets < <(
            gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -E '^open-static-[A-Z-]+\.sqlite3$' || true
          )
          for stale_asset in "${stale_regional_sqlite_assets[@]}"; do
            gh release delete-asset "$release_tag" "$stale_asset" --yes >/dev/null 2>&1 || true
          done

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "Open static SQLite bundle ${release_tag}" \
              --notes-file "$release_notes" \
              --latest
            gh release delete-asset "$release_tag" open_static.sqlite3 --yes >/dev/null 2>&1 || true
            gh release upload "$release_tag" \
              "$RUNNER_TEMP/open-static/open_static.sqlite3.zst" \
              "$RUNNER_TEMP/open-static/open_static.sqlite3.zst.sha256" \
              "$RUNNER_TEMP/open-static/open_static.sqlite3.sha256" \
              "${regional_assets[@]}" \
              --clobber
          else
            gh release create "$release_tag" \
              "$RUNNER_TEMP/open-static/open_static.sqlite3.zst" \
              "$RUNNER_TEMP/open-static/open_static.sqlite3.zst.sha256" \
              "$RUNNER_TEMP/open-static/open_static.sqlite3.sha256" \
              "${regional_assets[@]}" \
              --title "Open static SQLite bundle ${release_tag}" \
              --notes-file "$release_notes" \
              --latest
          fi

      - name: Verify published combined release assets
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -t expected_assets < <(
            {
              printf '%s\n' \
                open_static.sqlite3.zst \
                open_static.sqlite3.zst.sha256 \
                open_static.sqlite3.sha256
              find "$RUNNER_TEMP/open-static-regional-packs" -maxdepth 1 -type f \( \
                -name 'open-static-*.sqlite3.zlib' -o \
                -name 'open-static-*.sqlite3.zlib.sha256' -o \
                -name 'open-static-*.sqlite3.sha256' -o \
                -name 'open-static-*.manifest.json' -o \
                -name 'regional_pack_index.json' \
              \) -printf '%f\n'
            } | sort -u
          )
          mapfile -t published_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort -u)

          for asset in "${expected_assets[@]}"; do
            if ! printf '%s\n' "${published_assets[@]}" | grep -Fx "$asset" >/dev/null; then
              echo "missing published release asset: $asset" >&2
              exit 1
            fi
          done
